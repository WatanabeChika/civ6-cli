[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civ6-cli"
dynamic = ["version"]
description = "A safe terminal interface for a running Civilization VI game"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["rich>=13.9,<15"]
keywords = ["civilization-vi", "cli", "firetuner", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]

[project.optional-dependencies]
test = ["lupa>=2.8,<3"]
release = ["build>=1.2,<2"]

[project.scripts]
civ6 = "civ6_cli.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "civ6_cli.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
